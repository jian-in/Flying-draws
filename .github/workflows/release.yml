name: CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, Test & Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里：后面 npm ci 会跑依赖的安装脚本，不能让它们拿到令牌
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        env:
          FLYINGDRAWS_SKIP_FUXI_DOWNLOAD: '1'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build application & MCP bridge
        run: npm run build

  release:
    name: Package Windows Desktop Bundle & Release
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 不把 GITHUB_TOKEN 留在 .git/config 里：后面 npm ci 会跑依赖的安装脚本，不能让它们拿到令牌
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        env:
          FLYINGDRAWS_SKIP_FUXI_DOWNLOAD: '1'
        run: npm ci

      - name: Fetch verified prebuilt Fuxi kernel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch:fuxi

      - name: Build application & MCP bridge
        run: npm run build

      - name: Package standalone desktop bundle (with built-in Fuxi kernel)
        run: npm run package:desktop -- --require-fuxi

      - name: Create Flying-draws-win32-x64.zip
        shell: pwsh
        run: |
          7z a -tzip Flying-draws-win32-x64.zip .\dist\Flying-draws-win32-x64
          if (-not (Test-Path .\Flying-draws-win32-x64.zip)) {
            throw "Failed to create Flying-draws-win32-x64.zip"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: Flying-draws-win32-x64.zip
          generate_release_notes: true

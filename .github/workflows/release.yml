name: CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, Test & Build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build application & MCP bridge
        run: npm run build

  release:
    name: Package Windows Canvas Bundle & Release
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application & MCP bridge
        run: npm run build

      - name: Package standalone canvas bundle (without Fuxi)
        run: npm run package:canvas

      - name: Create Flying-draws-win32-x64.zip
        shell: pwsh
        run: |
          7z a -tzip Flying-draws-win32-x64.zip .\dist\Flying-draws-win32-x64
          if (-not (Test-Path .\Flying-draws-win32-x64.zip)) {
            throw "Failed to create Flying-draws-win32-x64.zip"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Flying-draws-win32-x64.zip
          generate_release_notes: true
